<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            font-size: 24px;
        }
        html{
            height: 100vh;
        }
        .body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .conT2B{
            display: flex;
            flex-direction: column;
            row-gap: 5px;
        }
        .conL2R{
            display: flex;
            column-gap: 5px;
        }
    </style>
</head>
<body class="body">
    <div class="body" id="signup">
        <h4 style="border: 2px solid #757575; border-radius: 12px; background-color: #E0E0E0; padding: 4px;">Signup to Continue</h4>
        <div class="conT2B" style="margin-top: 15px; border: 1px solid #9e9e9e; padding: 8px; border-radius: 12px; gap: 20px;">
            <div class="conL2R" style="margin-top: 10px;">
                <p>Username : </p>
                <input type="text" id="sp_user" required>
            </div>
            <div class="conL2R">
                <p>Password : </p>
                <input type="text" id="sp_pass" required>
            </div>
            <div class="conL2R">
                <p>Role : </p>
                <input type="text" id="role" required>
            </div>
            <button onclick="signup()" style="max-width: fit-content; align-self: center; border-radius: 8px; background-color: #2962ff; padding: 6px; color: white; margin-top: 6px;">Signup</button>
        </div>
        <div class="conL2R">
            <p style="margin-top: 4px;">Already have an account?</p>
            <a href="#" onclick="selector()" style="margin-top: 4px;">Login</a>
        </div>
    </div>

    <div class="body" id="login" style="display: none;">
        <h4 style="border: 2px solid #757575; border-radius: 12px; background-color: #E0E0E0; padding: 4px;">Login to Continue</h4>
        <div class="conT2B" style="margin-top: 15px; border: 1px solid #9e9e9e; padding: 8px; border-radius: 12px; gap: 20px;">
            <div class="conL2R" style="margin-top: 10px;">
                <p>Username : </p>
                <input type="text" id="ln_user" required>
            </div>
            <div class="conL2R">
                <p>Password : </p>
                <input type="text" id="ln_pass" required>
            </div>
            <button onclick="login()" style="max-width: fit-content; align-self: center; border-radius: 8px; background-color: #2962ff; padding: 6px; color: white; margin-top: 6px;">Login</button>
        </div>
        <div class="conL2R">
            <p style="margin-top: 4px;">Don't have an account?</p>
            <a href="#" onclick="selector()" style="margin-top: 4px;">Signup</a>
        </div>
    </div>

    <script>
        let s_url = "http://localhost:5500" ;
        var x=0 ;
        function selector()
        {
            x++ ;
            if(x%2 == 0)
            {
                document.getElementById("login").style.display = "none" ;
                document.getElementById("signup").style.display = "flex" ;
            }
            else
            {
                document.getElementById("login").style.display = "flex" ;
                document.getElementById("signup").style.display = "none" ;
            }
        }
        async function login()
        {
            const username = document.getElementById("ln_user").value;
            const password = document.getElementById("ln_pass").value;

            const body = {
                name: username,
                password: password
            };

            const resp = await fetch(s_url + "/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });
            if(resp.redirected)
            {
                window.location.href = resp.url ;
            }
            else
            {
                const data = await resp.json();
                alert(data.status);
            }
        }    
            
        async function signup()
        {
            const username = document.getElementById("sp_user").value;
            const password = document.getElementById("sp_pass").value;
            const role = document.getElementById("role").value;

            const body = {
                name: username,
                password: password,
                role: role
            };

            const resp = await fetch(s_url + "/api/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            if(resp.redirected)
            {
                window.location.href = resp.url ;
            }
            else
            {
                const data = await resp.json();
                alert(data.error);
            }
        }
    </script>

</body>
</html>
